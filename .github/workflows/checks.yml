name: Validate installer directory
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: pip install fastapi==0.129.0 httpx==0.28.1 requests==2.32.5 psycopg2-binary==2.9.11
      - run: python -B -m unittest discover -s backend
      - run: python -B -m unittest test_rules test_evidence test_claims test_contact_health test_inquiry_routing test_quote_agent test_verification_run test_recovery
        working-directory: ops/installer-agent
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
