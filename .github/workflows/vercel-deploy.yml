name: Deploy to Vercel (production)

# Restores push->deploy after the Vercel GitHub App link broke (link.repo empty, 0 hooks).
# Calls the same Vercel API deploy used manually since June. Added 2026-07-24 by Max.
# If the Vercel dashboard Git integration is ever reconnected, DELETE this workflow
# to avoid double deploys.

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: vercel-prod-deploy
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  deploy:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger Vercel production deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -e
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN secret is not set" >&2
            exit 1
          fi
          RESP=$(curl -fsS -X POST \
            "https://api.vercel.com/v13/deployments?teamId=team_Bw8q7W0VyM7AkJwKaIrk1CMh&forceNew=1" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"vicrez-installers-v2\",\"project\":\"prj_BGV7hvlbx3yCFEDVBTiJlN4J7jU4\",\"target\":\"production\",\"gitSource\":{\"type\":\"github\",\"org\":\"bd-vicrez\",\"repo\":\"installer-directory\",\"ref\":\"master\",\"sha\":\"$GITHUB_SHA\"}}")
          DEPLOYMENT=$(echo "$RESP" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('id') or d.get('uid') or '')")
          test -n "$DEPLOYMENT"
          echo "Waiting for deployment $DEPLOYMENT"
          for attempt in $(seq 1 75); do
            STATUS=$(curl -fsS "https://api.vercel.com/v13/deployments/$DEPLOYMENT?teamId=team_Bw8q7W0VyM7AkJwKaIrk1CMh" -H "Authorization: Bearer $VERCEL_TOKEN")
            STATE=$(echo "$STATUS" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('readyState') or d.get('state') or 'unknown')")
            case "$STATE" in
              READY) echo "Production deployment READY"; exit 0 ;;
              QUEUED|BUILDING|INITIALIZING) sleep 8 ;;
              *) echo "Deployment failed: $STATE" >&2; exit 1 ;;
            esac
          done
          echo "Timed out waiting for production readiness" >&2
          exit 1
